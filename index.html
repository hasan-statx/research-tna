<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>গবেষণা দক্ষতা যাচাই</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#1B2230; --muted:#5E6675; --line:#DCE0E5;
  --primary:#2B3A86; --primary-ink:#FFFFFF; --primary-soft:#E7EAF7;
  --mark:#D99A00; --mark-soft:#FBF0D2; --ok:#2F7A4F; --bad:#B23A3A;
  --l0:#E9ECF2; --l1:#C9D1EA; --l2:#8E9BD6; --l3:#2B3A86;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151C; --surface:#1A1F29; --ink:#E7E9EE; --muted:#A3AAB8; --line:#2E3543;
    --primary:#8F9DF0; --primary-ink:#10131A; --primary-soft:#232A45;
    --mark:#F2BE3D; --mark-soft:#3A3120; --ok:#6CC08F; --bad:#E58080;
    --l0:#252B37; --l1:#33406B; --l2:#5565B8; --l3:#8F9DF0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1A1F29; --ink:#E7E9EE; --muted:#A3AAB8; --line:#2E3543;
  --primary:#8F9DF0; --primary-ink:#10131A; --primary-soft:#232A45;
  --mark:#F2BE3D; --mark-soft:#3A3120; --ok:#6CC08F; --bad:#E58080;
  --l0:#252B37; --l1:#33406B; --l2:#5565B8; --l3:#8F9DF0;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hind Siliguri","Noto Sans Bengali","Kohinoor Bangla","Nirmala UI",sans-serif;
  font-size:17px;line-height:1.65}
h1,h2,h3{font-family:"Tiro Bangla","Noto Serif Bengali","Hind Siliguri",serif;font-weight:400;line-height:1.3;margin:0}
h1{font-size:2rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:.5rem 0}
.wrap{max-width:720px;margin:0 auto;padding:1.25rem 1rem 4rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-in{max-width:720px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:1rem}
.bar-title{font-family:"Tiro Bangla",serif;font-size:1.05rem;flex:1}
.steps{display:flex;gap:.35rem}
.steps span{width:28px;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.1rem;margin:1rem 0}
.q{margin:1.4rem 0}
.q-t{font-weight:600;margin-bottom:.5rem}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.opt input{margin-top:.35rem;accent-color:var(--primary)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt.dk{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips .opt{flex:0 1 auto}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin-top:.35rem}
.scale label{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.45rem .2rem;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);text-align:center;line-height:1.2}
.scale label b{font-size:1.1rem;font-weight:600}
.scale label small{font-size:.72rem;color:var(--muted)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.scale label:has(input:checked) small{color:var(--primary-ink)}
.scale label:has(input:focus-visible),.opt:has(input:focus-visible){outline:2px solid var(--mark);outline-offset:2px}
.dom-h{margin-top:2rem;padding-bottom:.3rem;border-bottom:1px solid var(--line);color:var(--muted);font-size:.95rem}
.item{margin:1rem 0 1.3rem}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}
input[type=text]:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
blockquote{margin:.6rem 0;padding:.7rem .9rem;border-left:3px solid var(--primary);background:var(--surface);font-family:Georgia,"Times New Roman",serif;font-size:1rem}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.6rem}
button{font:inherit;cursor:pointer;border-radius:8px;padding:.6rem 1.2rem;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
button.link{border:none;background:none;color:var(--bad);padding:.6rem .2rem;text-decoration:underline}
.err{color:var(--bad);font-weight:500;margin-top:.8rem}
.note{background:var(--mark-soft);border-radius:8px;padding:.7rem .9rem;margin:1rem 0}
/* ladder */
.ladder{margin:1rem 0}
.lrow{display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr;gap:.6rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)}
.lname{font-weight:500;line-height:1.3}
.lname small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.lcells{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.lc{height:34px;border-radius:5px;background:var(--l0);position:relative;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted)}
.lc.fill1{background:var(--l1)} .lc.fill2{background:var(--l2);color:var(--primary-ink)} .lc.fill3{background:var(--l3);color:var(--primary-ink)}
.lc.me{outline:2.5px solid var(--mark);outline-offset:1px;font-weight:600;color:var(--ink)}
.lc.me.fill2,.lc.me.fill3{color:var(--primary-ink)}
.lhead{display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr;gap:.6rem;font-size:.75rem;color:var(--muted)}
.lhead .lcells{text-align:center}
.lhead .lcells span{display:block}
.board{list-style:none;margin:.6rem 0 0;padding:0;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.board li{display:flex;gap:.8rem;align-items:center;padding:.4rem .8rem;border-bottom:1px solid var(--line)}
.board li:last-child{border-bottom:none}
.board .rk{width:2.5rem;color:var(--muted);font-variant-numeric:tabular-nums}
.board .bw{flex:1;height:8px;background:var(--l0);border-radius:4px;overflow:hidden}
.board .bw i{display:block;height:100%;background:var(--l2)}
.board .pc{width:3.5rem;text-align:right;font-variant-numeric:tabular-nums}
.board li.me{background:var(--mark-soft);font-weight:600}
.board li.me .bw i{background:var(--mark)}
.qgrid{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.qgrid span{width:2.3rem;height:2.3rem;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.85rem;border:1px solid var(--line)}
.qgrid .y{background:var(--ok);color:#fff;border-color:var(--ok)}
.qgrid .n{background:transparent;color:var(--bad);border-color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}
ul.recs{padding-left:1.2rem;margin:.4rem 0}
ul.recs li{margin:.25rem 0}
@media (max-width:520px){
  h1{font-size:1.65rem}
  .lrow,.lhead{grid-template-columns:1fr}
  .lhead .lname{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .lc.me{animation:pop .5s ease-out both}
  @keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
}
</style>
</head>

function setSteps(n){
  var el=document.getElementById("steps"); var h="";
  for(var i=1;i<=4;i++) h+='<span class="'+(i<=n?"on":"")+'"></span>';
  el.innerHTML = n>0? h : "";
}

/* ---------- scoring ---------- */
function score(selfAns, mcqAns, track){
  var correct = mcqAns.map(function(v,i){ return v===MCQ[i].a; });
  var pts = 0; MCQ.forEach(function(m,i){ if(correct[i]) pts+=PTS[m.f]; });
  var levels=[], avgs=[], verified=[];
  for(var d=0; d<DOMAINS.length; d++){
    var vals=[]; SELF.forEach(function(it,i){ if(it[0]===d) vals.push(selfAns[i]); });
    var avg = vals.reduce(function(s,x){return s+x;},0)/vals.length;
    var lv = avg<1?0: avg<2?1: avg<=2.5?2:3;
    var qs=[]; MCQ.forEach(function(m,i){ if(m.d.indexOf(d)>=0) qs.push(i); });
    if(lv>=2 && qs.some(function(i){ return MCQ[i].f!=="h" && !correct[i]; })) lv-=1;
    if(lv===3 && qs.some(function(i){ return !correct[i]; })) lv=2;
    levels.push(lv); avgs.push(Math.round(avg*100)/100); verified.push(qs.length>0);
  }
  return {pts:pts, pct:Math.round(pts/MAXPTS*100), correct:correct, levels:levels, avgs:avgs, verified:verified, track:track};
}

function recs(sc){
  var need = CORE.slice(); (TRACK_DOMS[sc.track]||[]).forEach(function(d){ if(need.indexOf(d)<0) need.push(d); });
  var start = need.filter(function(d){ return sc.levels[d]<=1; }).sort(function(x,y){ return sc.levels[x]-sc.levels[y]; });
  var strong = [];
  sc.levels.forEach(function(l,d){ if(l>=2) strong.push(d); });
  strong.sort(function(x,y){ return sc.levels[y]-sc.levels[x]; });
  return {start:start.slice(0,3), strong:strong.slice(0,3), need:need};
}

  document.getElementById("next").onclick=function(){
    var miss=[]; S.self.forEach(function(v,i){ if(v===null) miss.push(i); });
    if(miss.length){ document.getElementById("err").textContent=bn(miss.length)+"টি কাজের নম্বর দেওয়া বাকি।"; document.getElementById("s"+miss[0]).scrollIntoView({block:"center"}); return; }
    app.removeEventListener("change", onSelf); S.step=3; saveDraft(); render(); window.scrollTo(0,0);
  };
}
function onSelf(e){ var t=e.target; if(t.name && t.name.indexOf("self")===0){ S.self[+t.name.slice(4)]=+t.value; saveDraft(); } }

function renderC(){
  setSteps(3);
  var h='<p class="muted small">অংশ ৩ / ৩</p><h2>ছোট যাচাই</h2>'+
   '<p>১৪টি প্রশ্ন, প্রতিটিতে একটি উত্তর। ইন্টারনেট বা এআই ছাড়া নিজে করুন।</p>';
  MCQ.forEach(function(m,i){
    h+='<div class="q" id="m'+i+'">';
    if(m.passage) h+='<div class="small muted">নিচের অনুচ্ছেদটি পড়ুন:</div><blockquote lang="en">'+PASSAGE+'</blockquote>';
    h+='<div class="q-t">'+bn(i+1)+'. '+m.q+'</div><div class="opts">'+
      m.o.map(function(o,j){ return '<label class="opt"><input type="radio" name="mcq'+i+'" value="'+j+'"'+(S.mcq[i]===j?" checked":"")+'><span>'+LETTERS[j]+') '+o+'</span></label>'; }).join("")+
      '<label class="opt dk"><input type="radio" name="mcq'+i+'" value="'+DK+'"'+(S.mcq[i]===DK?" checked":"")+'><span>জানি না</span></label></div></div>';
  });
  h+='<div class="err" id="err" role="alert"></div><div class="btns"><button id="back">পেছনে</button><button class="pri" id="sub">জমা দিন ও ফলাফল দেখুন</button></div>';
  app.innerHTML=h;
  app.addEventListener("change", onMcq);
  document.getElementById("back").onclick=function(){ app.removeEventListener("change", onMcq); S.step=2; render(); window.scrollTo(0,0); };
  document.getElementById("sub").onclick=function(){
    var miss=[]; S.mcq.forEach(function(v,i){ if(v===null) miss.push(i); });
    if(miss.length){ document.getElementById("err").textContent=bn(miss.length)+"টি প্রশ্নের উত্তর বাকি। না জানলে \u201Cজানি না\u201D বেছে নিন।"; document.getElementById("m"+miss[0]).scrollIntoView({block:"center"}); return; }
    app.removeEventListener("change", onMcq);
    submit();
  };
}
function onMcq(e){ var t=e.target; if(t.name && t.name.indexOf("mcq")===0){ S.mcq[+t.name.slice(3)]=+t.value; saveDraft(); } }

function randId(){
  var a=new Uint8Array(12); crypto.getRandomValues(a);
  return "p"+Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2);}).join("");
}

function submit(){
  var btn=document.getElementById("sub"); btn.disabled=true; btn.textContent="জমা হচ্ছে…";
  var sc = score(S.self, S.mcq, S.a.track);
  var poolId = (S.saved && S.saved.poolId) || randId();
  var mine = {v:1, a:S.a, self:S.self, mcq:S.mcq, sc:sc, poolId:poolId, at:new Date().toISOString().slice(0,10)};
  var pub = {v:1, pct:sc.pct, lv:sc.levels, track:sc.track};
  S.db.doc("data/users/"+S.uid+"/result").set(mine).then(function(){
    return S.db.collection("pool").doc(poolId).set(pub);
  }).then(function(){
    S.saved=mine; clearDraft(); S.view="result"; subscribePool(); render(); window.scrollTo(0,0);
  }).catch(function(e){
    btn.disabled=false; btn.textContent="জমা দিন ও ফলাফল দেখুন";
    var msg = (e && e.code==="invalid_argument") ? "জমা দেওয়ার অনুমতি নেই। আয়োজকের কাছে এই লিংকে জমা দেওয়ার অনুমতি চেয়ে নিন।" :
              (e && e.code==="quota_exceeded") ? "জমার জায়গা পূর্ণ হয়ে গেছে। আয়োজককে জানান।" :
              "জমা হয়নি, সংযোগে সমস্যা। একটু পরে আবার চাপুন; আপনার উত্তরগুলো রাখা আছে।";
    document.getElementById("err").textContent=msg;
  });
}

function subscribePool(){
  if(S.unsubPool || !S.db) return;
  S.unsubPool = S.db.collection("pool").onSnapshot(function(snap){
    S.pool = snap.docs.map(function(d){ var x=d.data()||{}; return {id:d.id, pct:x.pct, lv:x.lv, track:x.track}; })
      .filter(function(x){ return typeof x.pct==="number" && Array.isArray(x.lv) && x.lv.length===DOMAINS.length; });
    S.poolReady=true;
    if(S.view==="result") renderResult();
  }, function(){ S.poolReady=true; if(S.view==="result") renderResult(); });
}

function renderResult(){
  setSteps(0);
  var m=S.saved, sc=m.sc, r=recs(sc);
  var n=S.pool.length, show = S.poolReady && n>=K_MIN;
  var dist = DOMAINS.map(function(){ return [0,0,0,0]; });
  S.pool.forEach(function(p){ p.lv.forEach(function(l,d){ if(l>=0&&l<=3) dist[d][l]++; }); });

  var h='<h1>আপনার ফলাফল</h1>'+
   '<p>যাচাই অংশে '+bn(MAXPTS)+'-এর মধ্যে '+bn(sc.pts)+' পয়েন্ট ('+bn(sc.pct)+'%)। কঠিন প্রশ্নে বেশি পয়েন্ট ধরা হয়েছে। নিচে নয়টি ক্ষেত্রে আপনার লেভেল হলুদ রেখায় চিহ্নিত'+(show?'; প্রতিটি ঘরের ছোট সংখ্যা হলো ওই লেভেলে থাকা অংশগ্রহণকারীর শতাংশ।':'।')+'</p>';

  h+='<div class="ladder"><div class="lhead"><div class="lname"></div><div class="lcells">'+LEVELS.map(function(l){return '<span>'+l+'</span>';}).join("")+'</div></div>';
  DOMAINS.forEach(function(name,d){
    var lv=sc.levels[d];
    h+='<div class="lrow"><div class="lname">'+name+(sc.verified[d]?'':'<small>শুধু স্ব-মূল্যায়ন</small>')+'</div><div class="lcells">';
    for(var k=0;k<4;k++){
      var cls="lc"+(k<=lv?" fill"+lv:"")+(k===lv?" me":"");
      var txt = show? bn(Math.round(dist[d][k]/n*100))+"%" : (k===lv?"আপনি":"");
      h+='<div class="'+cls+'" title="'+LEVELS[k]+': '+LEVEL_DESC[k]+'">'+txt+'</div>';
    }
    h+='</div></div>';
  });
  h+='</div>';

  h+='<div class="card"><h3>প্রশিক্ষণ কোথা থেকে শুরু করবেন</h3>';
  if(r.start.length){
    h+='<p class="small muted">আপনার আগ্রহ ('+sc.track+') ও সবার জন্য আবশ্যিক ক্ষেত্রগুলোর মধ্যে যেগুলোতে লেভেল সবচেয়ে কম:</p><ul class="recs">'+
      r.start.map(function(d){ return '<li>'+DOMAINS[d]+' — এখন '+LEVELS[sc.levels[d]]+'; লক্ষ্য স্বনির্ভর</li>'; }).join("")+'</ul>';
  } else {
    h+='<p class="small">আপনার প্রয়োজনীয় সব ক্ষেত্রে আপনি অন্তত স্বনির্ভর। এখন হাতে-কলমে একটি পূর্ণ গবেষণা প্রকল্পে যুক্ত হওয়াই পরের ধাপ।</p>';
  }
  if(r.strong.length) h+='<p class="small"><b>আপনার শক্তির জায়গা:</b> '+r.strong.map(function(d){return DOMAINS[d];}).join(", ")+'</p>';
  h+='</div>';

  h+='<div class="card"><h3>যাচাই প্রশ্নের ফল</h3><p class="small muted">সবুজ = সঠিক। সঠিক উত্তর এখানে দেখানো হয় না, যাতে পরের অংশগ্রহণকারীদের যাচাই ঠিক থাকে।</p><div class="qgrid">'+
    sc.correct.map(function(c,i){ return '<span class="'+(c?"y":"n")+'" aria-label="প্রশ্ন '+bn(i+1)+(c?" সঠিক":" সঠিক নয়")+'">'+bn(i+1)+'</span>'; }).join("")+'</div></div>';

  h+='<div class="card"><h3>সবার মধ্যে আপনার অবস্থান</h3>';
  if(!S.poolReady){ h+='<p class="small muted">তুলনার তথ্য আসছে…</p>'; }
  else if(!show){ h+='<p class="small">এ পর্যন্ত '+bn(n)+' জন জমা দিয়েছেন। পরিচয় গোপন রাখতে অন্তত '+bn(K_MIN)+' জন হলে তুলনা দেখানো হবে।</p>'; }
  else {
    var sorted=S.pool.slice().sort(function(x,y){ return y.pct-x.pct; });
    var myRank=1; sorted.forEach(function(p){ if(p.pct>sc.pct) myRank++; });
    var below=sorted.filter(function(p){ return p.pct<sc.pct; }).length;
    h+='<p class="small">যাচাই স্কোরে '+bn(n)+' জনের মধ্যে আপনার অবস্থান '+bn(myRank)+'। আপনি '+bn(Math.round(below/n*100))+'% অংশগ্রহণকারীর চেয়ে বেশি পেয়েছেন। তালিকায় শুধু নামবিহীন স্কোর আছে; সমান স্কোর পেলে একই অবস্থান।</p><ol class="board">';
    var rank=0, prev=null;
    sorted.forEach(function(p,i){
      if(p.pct!==prev){ rank=i+1; prev=p.pct; }
      var me = p.id===m.poolId;
      h+='<li class="'+(me?"me":"")+'"><span class="rk">'+bn(rank)+'</span><span class="bw"><i style="width:'+p.pct+'%"></i></span><span class="pc">'+bn(p.pct)+'%</span>'+(me?'<span>আপনি</span>':'')+'</li>';
    });
    h+='</ol>';
  }
  h+='</div>';

  if(S.isOwner) h+=ownerPanel();

  h+='<div class="err" id="err" role="alert"></div><div class="btns"><button id="retake">আবার যাচাই দিন</button><button class="link" id="del">আমার ফলাফল মুছে ফেলুন</button></div>'+
     '<p class="small muted">জমার তারিখ: '+bn(m.at||"")+'</p>';
  app.innerHTML=h;

  document.getElementById("retake").onclick=function(){
    S.a={stream:[],degree:"",group:null,exp:null,expText:"",track:null,hours:null};
    S.self=new Array(SELF.length).fill(null); S.mcq=new Array(MCQ.length).fill(null);
    S.view="form"; S.step=1; render(); window.scrollTo(0,0);
  };
  document.getElementById("del").onclick=function(){
    if(!confirm("আপনার উত্তর, ফলাফল ও তুলনার তালিকার স্কোর স্থায়ীভাবে মুছে যাবে। মুছবেন?")) return;
    var b=this; b.disabled=true;
    S.db.collection("pool").doc(m.poolId).delete().then(function(){
      return S.db.doc("data/users/"+S.uid+"/result").delete();
    }).then(function(){
      S.saved=null; S.view="form"; S.step=0; render(); window.scrollTo(0,0);
    }).catch(function(){ b.disabled=false; document.getElementById("err").textContent="মোছা যায়নি। একটু পরে আবার চেষ্টা করুন।"; });
  };
  var dl=document.getElementById("csv"); if(dl) dl.onclick=downloadCsv;
}

function ownerPanel(){
  var n=S.pool.length;
  var h='<div class="card"><h3>আয়োজকের সারাংশ</h3><p class="small muted">এটি শুধু আপনি (আর্টিফ্যাক্টের মালিক) দেখছেন। এখানেও কোনো নাম নেই; প্রশিক্ষণ পরিকল্পনার জন্য দলগত চিত্র।</p>';
  if(!n){ return h+'<p class="small">এখনো কেউ জমা দেননি।</p></div>'; }
  var tc={}; TRACKS.forEach(function(t){tc[t]=0;}); S.pool.forEach(function(p){ if(tc[p.track]!==undefined) tc[p.track]++; });
  var avg=Math.round(S.pool.reduce(function(s,p){return s+p.pct;},0)/n);
  h+='<p class="small">মোট জমা '+bn(n)+' জন, গড় যাচাই স্কোর '+bn(avg)+'%।</p>';
  h+='<p class="small">আগ্রহ: '+TRACKS.map(function(t){ return t+' '+bn(tc[t]); }).join(", ")+'</p>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>ক্ষেত্র</th>'+LEVELS.map(function(l){return '<th>'+l+'</th>';}).join("")+'</tr></thead><tbody>';
  DOMAINS.forEach(function(name,d){
    var c=[0,0,0,0]; S.pool.forEach(function(p){ var l=p.lv[d]; if(l>=0&&l<=3) c[l]++; });
    h+='<tr><td>'+name+'</td>'+c.map(function(x){ return '<td>'+bn(x)+'</td>'; }).join("")+'</tr>';
  });
  h+='</tbody></table></div><div class="btns"><button id="csv">নামবিহীন ডেটা CSV নামান</button></div></div>';
  return h;
}

function downloadCsv(){
  claude.use("downloads").then(function(dl){
    if(!dl){ document.getElementById("err").textContent="এই ভিউতে ফাইল নামানো যাচ্ছে না।"; return; }
    var rows=[["score_pct","track"].concat(DOMAINS.map(function(d,i){return "domain"+(i+1)+"_level";}))];
    S.pool.forEach(function(p){ rows.push([p.pct,p.track].concat(p.lv)); });
    var csv="\uFEFF"+rows.map(function(r){ return r.map(function(x){ return '"'+String(x).replace(/"/g,'""')+'"'; }).join(","); }).join("\n");
    return dl.save({filename:"research-skills-tna-anonymous.csv", data:new Blob([csv],{type:"text/csv"})});
  }).catch(function(){});
}

/* ---------- boot ---------- */
function gate(msg){ S.view="gate"; S.gateMsg=msg; render(); }

function timeout(p, ms){ return Promise.race([p, new Promise(function(_,rej){ setTimeout(function(){ rej({code:"timeout"}); }, ms); })]); }

function boot(){
  if(!window.claude || !window.claude.use){ return gate("এই পেজটি claude.ai-তে খুলতে হবে। আয়োজকের দেওয়া লিংকটি ব্রাউজারে খুলে নিজের অ্যাকাউন্টে (যেমন Gmail দিয়ে) লগ ইন করুন।"); }
  Promise.all([claude.use("db"), claude.use("user")]).then(function(res){
    S.db=res[0]; S.user=res[1];
    if(!S.db || !S.user) return gate("জমা দিতে ও ফলাফল দেখতে claude.ai-তে লগ ইন থাকতে হবে। লগ ইন করে লিংকটি আবার খুলুন।");
    return Promise.all([S.user.id(), S.user.can("data.write"), S.user.isOwner()]).then(function(x){
      S.uid=x[0]; S.canWrite=x[1]; S.isOwner=x[2];
      if(!S.uid) return gate("আপনার অ্যাকাউন্ট শনাক্ত করা যাচ্ছে না। claude.ai-তে লগ ইন করে লিংকটি আবার খুলুন।");
      return timeout(S.db.doc("data/users/"+S.uid+"/result").get(), 10000).then(function(snap){
        if(snap.exists){ S.saved=snap.data(); S.view="result"; subscribePool(); render(); }
        else { S.view="form"; loadDraft(); render(); }
      });
    });
  }).catch(function(e){
    if(e && e.code==="timeout") gate("সংযোগ পাওয়া যাচ্ছে না। ইন্টারনেট দেখে কিছুক্ষণ পর পেজটি আবার খুলুন।");
    else gate("এই মুহূর্তে পেজটি চালু করা যাচ্ছে না। কিছুক্ষণ পর আবার খুলুন।");
  });
}
app.innerHTML='<p class="muted">লোড হচ্ছে…</p>';
boot();
})();
</script>
</body>
</html>
