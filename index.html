<title>গবেষণা লেভেল এসেসমেন্ট</title>

<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#1B2826; --muted:#5E706C; --line:#D6E0DD;
  --primary:#0F5C4F; --primary-ink:#FFFFFF; --accent:#C98A12; --warn:#A6402B;
  --l0:#D9E1DF; --l1:#A8CFC3; --l2:#4F9B89; --l3:#0F5C4F;
  --focus:#C98A12;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1716; --surface:#172220; --ink:#E4ECEA; --muted:#9AAFAA; --line:#2A3A37;
    --primary:#5FB8A2; --primary-ink:#0F1716; --accent:#E3B04B; --warn:#E07A62;
    --l0:#2A3A37; --l1:#2F6B5D; --l2:#4B9F8B; --l3:#86D3BF; --focus:#E3B04B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#172220; --ink:#E4ECEA; --muted:#9AAFAA; --line:#2A3A37;
  --primary:#5FB8A2; --primary-ink:#0F1716; --accent:#E3B04B; --warn:#E07A62;
  --l0:#2A3A37; --l1:#2F6B5D; --l2:#4B9F8B; --l3:#86D3BF; --focus:#E3B04B;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
h1,h2,h3{font-family:"Tiro Bangla","Noto Serif Bengali",serif;font-weight:400;line-height:1.3;margin:0}
h1{font-size:2rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:.5em 0}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 64px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;max-width:860px;margin:0 auto}
.brand{font-family:"Tiro Bangla",serif;font-size:1.1rem}
.who{font-size:.9rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);padding:10px 18px}
button.ghost{background:transparent;color:var(--primary)}
button.small{padding:4px 10px;font-size:.88rem}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.banner{background:var(--accent);color:#1B1300;padding:8px 18px;font-size:.92rem;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.hero{padding:40px 0 24px}
.hero p{max-width:60ch;color:var(--muted)}
.steps{display:flex;gap:0;margin:22px 0 28px;border-bottom:1px solid var(--line)}
.steps span{padding:8px 14px;color:var(--muted);border-bottom:3px solid transparent;font-size:.95rem}
.steps span.on{color:var(--ink);border-color:var(--primary)}
label.f{display:block;margin:18px 0 6px;font-weight:500}
input[type=text],input[type=email],select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;gap:6px;align-items:center}
.scale-head{display:grid;grid-template-columns:1fr repeat(4,44px);gap:4px;font-size:.8rem;color:var(--muted);position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.scale-head span{text-align:center}
.domain-title{margin:22px 0 4px;color:var(--primary);font-weight:600;font-size:.95rem}
.sec{margin:30px 0 4px;color:var(--primary);border-bottom:2px solid var(--line);padding-bottom:6px}
.srow{display:grid;grid-template-columns:1fr repeat(4,44px);gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow label.opt{display:flex;justify-content:center;cursor:pointer}
.srow input{width:20px;height:20px;accent-color:var(--primary)}
.legend{font-size:.9rem;color:var(--muted)}
.mcq{padding:16px 0;border-bottom:1px solid var(--line)}
.mcq .q{font-weight:500;margin-bottom:8px}
.mcq label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.mcq label:hover{background:var(--bg)}
.mcq input{margin-top:6px;accent-color:var(--primary)}
blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--bg);font-family:Georgia,serif;font-size:.98rem}
.nav{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
.err{color:var(--warn);font-size:.92rem;margin-top:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 22px;overflow-x:auto}
.tabs button{background:transparent;color:var(--muted);border:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--primary)}
.lead{font-size:1.15rem;max-width:62ch}
.lead b{font-weight:600}
/* level ladder */
.ladder{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(4,minmax(46px,1fr)) 54px;gap:4px 4px;align-items:center;margin-top:18px}
.ladder .h{font-size:.8rem;color:var(--muted);text-align:center;padding-bottom:4px}
.ladder .h.left{text-align:left}
.ladder .name{font-size:.95rem;padding-right:8px}
.ladder .name small{display:block;color:var(--warn);font-size:.78rem}
.ladder .cell{height:26px;border-radius:4px;border:1px dashed var(--line)}
.ladder .cell.f0{background:var(--l0);border-color:transparent}
.ladder .cell.f1{background:var(--l1);border-color:transparent}.ladder .cell.f2{background:var(--l2);border-color:transparent}.ladder .cell.f3{background:var(--l3);border-color:transparent}
.ladder .score{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.ladder-wrap{overflow-x:auto}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.85rem;border:1px solid var(--line)}
.chip.l0{background:var(--l0);color:var(--ink)}.chip.l1{background:var(--l1);color:#0F2A24}.chip.l2{background:var(--l2);color:#fff}.chip.l3{background:var(--l3);color:var(--primary-ink)}
.next li{margin:6px 0}
.lb{width:100%;border-collapse:collapse}
.lb td,.lb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.95rem}
.lb th{color:var(--muted);font-weight:500;font-size:.85rem}
.lb tr.me{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.bar{height:10px;border-radius:5px;background:var(--l0);position:relative;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--primary)}
.note{font-size:.88rem;color:var(--muted)}
.dist{display:grid;grid-template-columns:minmax(140px,1.2fr) 3fr 46px;gap:6px 10px;align-items:center;margin-top:14px}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--l0)}
.stack span{display:block;height:100%}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:10px}
.keyrow i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scroll{overflow-x:auto}
.admin td,.admin th{white-space:nowrap}
.center{text-align:center}
@media (max-width:560px){
  h1{font-size:1.6rem}
  .scale-head,.srow{grid-template-columns:1fr repeat(4,34px)}
  .ladder{grid-template-columns:minmax(120px,1.4fr) repeat(4,minmax(30px,1fr)) 44px}
}
@media (prefers-reduced-motion:no-preference){
  .ladder .cell{transition:background .4s}
}
</style>
</head>

const INTERESTS = ["গুণগত (Qualitative)","পরিমাণগত (Quantitative)","মিশ্র পদ্ধতি (Mixed methods)","এখনো নিশ্চিত নই"];
const CORE = ["d1","d2","d6","d8","d9"];
function relevantDomains(interest){
  if(interest===INTERESTS[0]) return [...CORE,"d3"];
  if(interest===INTERESTS[1]) return [...CORE,"d4","d7"];
  if(interest===INTERESTS[2]) return [...CORE,"d3","d4","d5","d7"];
  return DOMAINS.map(d=>d.id);
}

function levelFromSelf(avg){ return avg<1?0: avg<2?1: avg<=2.5?2:3; }
function levelFromScore(s){ return s<35?0: s<60?1: s<80?2:3; }

function scoreSubmission(self, answers){
  const domains = {};
  for(const d of DOMAINS){
    const items = SELF.filter(s=>s.d===d.id);
    const selfAvg = items.reduce((a,s)=>a+Number(self[s.id]),0)/items.length;
    const qs = MCQ.filter(q=>q.d===d.id);
    const correct = qs.map(q=>Number(answers[q.id])===q.c);
    const acc = qs.length? correct.filter(Boolean).length/qs.length : null;
    const score = Math.round(acc===null ? (selfAvg/3)*100 : ((selfAvg/3)*0.5 + acc*0.5)*100);
    let level = levelFromScore(score);
    // দক্ষ স্তর পেতে সংশ্লিষ্ট কঠিন প্রশ্নও সঠিক হতে হবে
    const hard = qs.filter(q=>q.diff===3);
    if(level===3 && hard.some(q=>Number(answers[q.id])!==q.c)) level = 2;
    // নিজের দেওয়া মানের চেয়ে যাচাইয়ের পর স্তর কম হলে চিহ্নিত করা হয়
    const adjusted = levelFromSelf(selfAvg) > level;
    domains[d.id] = {selfAvg:Math.round(selfAvg*100)/100, acc, level, adjusted, score};
  }
  const overall = Math.round(Object.values(domains).reduce((a,x)=>a+x.score,0)/DOMAINS.length);
  const correctTotal = MCQ.filter(q=>Number(answers[q.id])===q.c).length;
  return {domains, overall, level:levelFromScore(overall), correctTotal};
}

async function makeFirebaseBackend(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const {initializeApp} = await import(`${base}/firebase-app.js`);
  const A = await import(`${base}/firebase-auth.js`);
  const F = await import(`${base}/firebase-firestore.js`);
  const fapp = initializeApp(CONFIG.firebase);
  const auth = A.getAuth(fapp);
  const db = F.getFirestore(fapp);
  const entriesCol = () => F.collection(db,"rounds",CONFIG.round,"entries");
  const lbRef = uid => F.doc(db,"rounds",CONFIG.round,"leaderboard",uid);
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid, email:u.email, name:u.displayName||""} : null)),
    signIn: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signOut: () => A.signOut(auth),
    // নিজের সব জমা, নতুনটি আগে
    getMine: async uid => {
      const qs = await F.getDocs(F.query(entriesCol(), F.where("uid","==",uid)));
      return qs.docs.map(d=>d.data()).sort((a,b)=>(b.clientTime||0)-(a.clientTime||0));
    },
    // প্রতিটি জমা নতুন ডকুমেন্ট; লিডারবোর্ডে প্রত্যেকের সর্বশেষ জমা
    submit: async (uid, sub, lb) => {
      const b = F.writeBatch(db);
      b.set(F.doc(entriesCol()), {...sub, uid, createdAt:F.serverTimestamp()});
      b.set(lbRef(uid), lb);
      await b.commit();
    },
    leaderboard: async () => {
      const qs = await F.getDocs(F.collection(db,"rounds",CONFIG.round,"leaderboard"));
      return qs.docs.map(d=>({id:d.id, ...d.data()}));
    },
    allSubmissions: async () => {
      const qs = await F.getDocs(entriesCol());
      return qs.docs.map(d=>({id:d.id, ...d.data()}));
    }
  };
}

function makeDemoBackend(){
  // শুধু দেখার জন্য: মেমোরিতে কিছু কাল্পনিক অংশগ্রহণকারী
  const entries = [], lb = {};
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for(let i=1;i<=14;i++){
    const skill = rnd();
    const self = {}; SELF.forEach(s=>self[s.id] = Math.max(0,Math.min(3,Math.round(skill*3 + (rnd()-.5)*1.6))));
    const answers = {}; MCQ.forEach(q=>answers[q.id] = rnd() < 0.35+skill*0.6 ? q.c : (q.c+1)%4);
    const r = scoreSubmission(self, answers);
    const id = "demo"+i;
    entries.push({uid:id, clientTime:Date.now()-i*3600e3, profile:{name:`নমুনা অংশগ্রহণকারী ${bn(i)}`, streams:[["কওমি","আলিয়া","জেনারেল"][i%3]], interest:INTERESTS[i%4]}, email:`demo${i}@example.com`, self, answers, result:r});
    lb[id] = {overall:r.overall, level:r.level, domains:Object.fromEntries(Object.entries(r.domains).map(([k,v])=>[k,v.score]))};
  }
  let user = null, listener = null;
  return {
    onAuth: cb => { listener = cb; cb(user); },
    signIn: async () => { user = {uid:"me-demo", email:CONFIG.adminEmails[0], name:"ডেমো ব্যবহারকারী"}; listener && listener(user); },
    signOut: async () => { user = null; listener && listener(null); },
    getMine: async uid => entries.filter(e=>e.uid===uid).sort((a,b)=>b.clientTime-a.clientTime),
    submit: async (uid, sub, l) => { entries.push({...sub, uid}); lb[uid] = l; },
    leaderboard: async () => Object.entries(lb).map(([id,v])=>({id,...v})),
    allSubmissions: async () => entries.map((v,i)=>({id:"e"+i,...v}))
  };
}

    html += `${q.sec?`<h3 class="sec">${esc(q.sec)}</h3>`:""}${q.sub?`<div class="domain-title">${esc(q.sub)}</div>`:""}
      <div class="mcq" role="radiogroup" aria-labelledby="t${q.id}">
      ${q.passage?`<p class="note">নিচের অনুচ্ছেদটি পড়ে উত্তর দিন:</p><blockquote lang="en">${esc(PASSAGE)}</blockquote>`:""}
      <div class="q" id="t${q.id}">${bn(n+1)}. ${esc(q.q)}</div>${opts}</div>`;
  });
  app.innerHTML = `${stepsBar()}
  <div class="panel">
    <h2>ছোট যাচাই</h2>
    <p class="legend">${bn(MCQ.length)}টি প্রশ্ন, প্রায় ১২ মিনিট। প্রশ্নগুলো গবেষণার ধাপ অনুযায়ী সাজানো। ইন্টারনেট বা এআই ছাড়া নিজে উত্তর দিন। না জানলে "জানি না" বাছুন, অনুমান করবেন না।</p>
    ${html}
    <p class="err" id="err"></p>
    <div class="nav"><button class="ghost" id="back">আগের ধাপ</button><button id="submit">জমা দিন</button></div>
  </div>`;
  app.querySelectorAll(".mcq input").forEach(i=>i.onchange = e => state.answers[e.target.name] = Number(e.target.value));
  $("#back").onclick = () => { state.step = 1; renderForm(); };
  $("#submit").onclick = submit;
}

async function submit(){
  const left = MCQ.filter(q=>state.answers[q.id]===undefined).length;
  if(left){ $("#err").textContent = `আরও ${bn(left)}টি প্রশ্নের উত্তর বাকি।`; return; }
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "জমা হচ্ছে…";
  const result = scoreSubmission(state.self, state.answers);
  const sub = {profile:state.profile, email:state.user.email, self:state.self, answers:state.answers, result, clientTime:Date.now()};
  const lb = {overall:result.overall, level:result.level, domains:Object.fromEntries(Object.entries(result.domains).map(([k,v])=>[k,v.score]))};
  try{
    await backend.submit(state.user.uid, sub, lb);
    state.mine = sub; state.history = [sub, ...state.history]; state.lbCache = null; state.tab = "me"; renderResults();
  }catch(e){
    btn.disabled = false; btn.textContent = "জমা দিন";
    $("#err").textContent = "জমা হয়নি: " + (e.code||e.message) + "। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।";
  }
}

/* ---------------- ফলাফল ---------------- */
async function getLb(){ if(!state.lbCache) state.lbCache = await backend.leaderboard(); return state.lbCache; }

async function renderResults(){
  const tabs = [["me","আমার ফল"],["lb","লিডারবোর্ড"],["sum","সবার সারসংক্ষেপ"]];
  if(isAdmin()) tabs.push(["admin","অ্যাডমিন"]);
  app.innerHTML = `<nav class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" aria-selected="${state.tab===k}" class="${state.tab===k?"on":""}" data-t="${k}">${n}</button>`).join("")}</nav><section id="pane"><p class="note">লোড হচ্ছে…</p></section>`;
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick = () => { state.tab = b.dataset.t; renderResults(); });
  const pane = $("#pane");
  try{
    if(state.tab==="me") await paneMe(pane);
    else if(state.tab==="lb") await paneLb(pane);
    else if(state.tab==="sum") await paneSum(pane);
    else await paneAdmin(pane);
  }catch(e){ pane.innerHTML = `<p class="err">তথ্য আনা যায়নি: ${esc(e.code||e.message)}। পেজটি রিফ্রেশ করে আবার দেখুন।</p>`; }
}

async function paneMe(pane){
  const r = state.mine.result;
  const lb = await getLb();
  const below = lb.filter(x=>x.overall < r.overall).length;
  const pct = lb.length>1 ? Math.round(below/(lb.length-1)*100) : null;
  const rel = relevantDomains(state.mine.profile.interest);
  const priorities = DOMAINS.filter(d=>rel.includes(d.id)).sort((a,b)=>r.domains[a.id].score - r.domains[b.id].score).slice(0,3);
  const strengths = DOMAINS.filter(d=>r.domains[d.id].level>=2).sort((a,b)=>r.domains[b.id].score - r.domains[a.id].score).slice(0,3);
  const adjustedN = Object.values(r.domains).filter(x=>x.adjusted).length;

  let ladder = `<div class="h left">ক্ষেত্র</div>${LEVELS.map(l=>`<div class="h">${l.name}</div>`).join("")}<div class="h">স্কোর</div>`;
  for(const d of DOMAINS){
    const x = r.domains[d.id];
    ladder += `<div class="name">${esc(d.name)}${x.adjusted?`<small>স্ব-মূল্যায়নের চেয়ে কম</small>`:""}</div>`
      + [0,1,2,3].map(i=>`<div class="cell ${i<=x.level?"f"+Math.min(x.level,3):""}" title="${LEVELS[i].name}"></div>`).join("")
      + `<div class="score">${bn(x.score)}</div>`;
  }
  pane.innerHTML = `
  <div class="panel">
    <h2>আপনার অবস্থান</h2>
    <p class="lead">সামগ্রিকভাবে আপনি <b>${LEVELS[r.level].name}</b> (${LEVELS[r.level].en}) স্তরে আছেন, স্কোর ${bn(r.overall)}/১০০। যাচাই অংশে ${bn(MCQ.length)}টির মধ্যে ${bn(r.correctTotal)}টি সঠিক।${pct!==null && lb.length>=CONFIG.minCohort?` আপনি অংশগ্রহণকারীদের ${bn(pct)}%-এর চেয়ে এগিয়ে।`:""}</p>
    <div class="ladder-wrap"><div class="ladder">${ladder}</div></div>
    <p class="note" style="margin-top:12px">প্রতিটি সারিতে যত ঘর ভরা, তত উঁচু স্তর। স্কোর = স্ব-মূল্যায়ন ও যাচাই প্রশ্নের ফলাফলের সমন্বয় (০-১০০)।${adjustedN?` ${bn(adjustedN)}টি ক্ষেত্রে যাচাই প্রশ্নের ফলাফল আপনার স্ব-মূল্যায়নের চেয়ে কম এসেছে; সেখানে নিজের দক্ষতা আরেকবার যাচাই করে নিন।`:""}</p>
  </div>
  <div class="panel" style="margin-top:16px">
    <h3>প্রশিক্ষণ শুরু করুন এখান থেকে</h3>
    <p class="note">আপনার আগ্রহের ধরন অনুযায়ী (${esc(state.mine.profile.interest)}) সবচেয়ে কম স্কোরের তিনটি ক্ষেত্র:</p>
    <ol class="next">${priorities.map(d=>`<li><b>${esc(d.module)}</b> <span class="chip l${r.domains[d.id].level}">${LEVELS[r.domains[d.id].level].name}</span></li>`).join("")}</ol>
    ${strengths.length?`<p class="note" style="margin-top:14px">আপনার শক্তির জায়গা: ${strengths.map(d=>esc(d.name)).join(", ")}।</p>`:""}
  </div>
  <div class="panel" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h3>আপনার জমার ইতিহাস</h3><button class="small" id="retake">আবার মূল্যায়ন দিন</button>
    </div>
    <p class="note">আবার দিলে নতুন জমা হিসেবে সংরক্ষিত হবে, আগেরগুলোও থেকে যাবে। লিডারবোর্ডে আপনার সর্বশেষ জমা গণ্য হয়।</p>
    <div class="scroll"><table class="lb"><thead><tr><th>জমা</th><th>সময়</th><th>স্কোর</th><th>স্তর</th></tr></thead>
    <tbody>${state.history.map((h,i)=>`<tr class="${i===0?"me":""}"><td>${bn(state.history.length-i)}</td><td>${fmtTime(h.clientTime)}</td><td>${bn(h.result.overall)}</td><td><span class="chip l${h.result.level}">${LEVELS[h.result.level].name}</span></td></tr>`).join("")}</tbody></table></div>
  </div>`;
  $("#retake").onclick = startRetake;
}

async function paneLb(pane){
  const lb = (await getLb()).sort((a,b)=>b.overall-a.overall);
  if(lb.length < CONFIG.minCohort){ pane.innerHTML = `<div class="panel"><p>কমপক্ষে ${bn(CONFIG.minCohort)} জন জমা দিলে লিডারবোর্ড দেখা যাবে, যাতে কারো পরিচয় অনুমান করা না যায়। এখন জমা পড়েছে ${bn(lb.length)}টি।</p></div>`; return; }
  const meIdx = lb.findIndex(x=>x.id===state.user.uid);
  pane.innerHTML = `<div class="panel">
    <h2>লিডারবোর্ড</h2>
    <p class="note">${bn(lb.length)} জন অংশগ্রহণকারী। নাম দেখানো হয় না; আপনার সারিটি চিহ্নিত।${meIdx>=0?` আপনার অবস্থান ${bn(meIdx+1)}।`:""}</p>
    <div class="scroll"><table class="lb">
      <thead><tr><th>ক্রম</th><th>অংশগ্রহণকারী</th><th style="width:40%">স্কোর</th><th></th><th>স্তর</th></tr></thead>
      <tbody>${lb.map((x,i)=>`<tr class="${i===meIdx?"me":""}"><td>${bn(i+1)}</td><td>${i===meIdx?"<b>আপনি</b>":"—"}</td><td><div class="bar"><i style="width:${x.overall}%"></i></div></td><td>${bn(x.overall)}</td><td><span class="chip l${x.level}">${LEVELS[x.level].name}</span></td></tr>`).join("")}</tbody>
    </table></div></div>`;
}

function cohortHtml(lb){
  const n = lb.length;
  const lvlCount = [0,0,0,0]; lb.forEach(x=>lvlCount[x.level]++);
  const avg = id => Math.round(lb.reduce((a,x)=>a+(x.domains?.[id]??0),0)/n);
  const sorted = [...DOMAINS].sort((a,b)=>avg(a.id)-avg(b.id));
  let dist = "";
  for(const d of sorted){
    const c = [0,0,0,0]; lb.forEach(x=>c[levelFromScore(x.domains?.[d.id]??0)]++);
    dist += `<div>${esc(d.name)}</div><div class="stack" role="img" aria-label="${esc(d.name)}: ${LEVELS.map((l,i)=>l.name+" "+c[i]).join(", ")}">${c.map((v,i)=>v?`<span style="width:${v/n*100}%;background:${levelColor(i)}" title="${LEVELS[i].name}: ${bn(v)} জন"></span>`:"").join("")}</div><div class="score">${bn(avg(d.id))}</div>`;
  }
  const weakest = sorted.slice(0,3).map(d=>d.name).join(", ");
  return `
    <p class="lead">${bn(n)} জনের মধ্যে ${LEVELS.map((l,i)=>`${l.name} স্তরে ${bn(lvlCount[i])} জন`).join(", ")}। দলগতভাবে সবচেয়ে দুর্বল ক্ষেত্র: <b>${esc(weakest)}</b>।</p>
    <div class="scroll"><div class="dist"><div class="note">ক্ষেত্র (দুর্বল থেকে সবল)</div><div class="note">স্তর অনুযায়ী অংশগ্রহণকারীদের ভাগ</div><div class="note">গড়</div>${dist}</div></div>
    <div class="keyrow">${LEVELS.map((l,i)=>`<span><i style="background:${levelColor(i)}"></i>${l.name}</span>`).join("")}</div>`;
}

async function paneSum(pane){
  const lb = await getLb();
  if(lb.length < CONFIG.minCohort){ pane.innerHTML = `<div class="panel"><p>কমপক্ষে ${bn(CONFIG.minCohort)} জন জমা দিলে সারসংক্ষেপ দেখা যাবে। এখন জমা পড়েছে ${bn(lb.length)}টি।</p></div>`; return; }
  pane.innerHTML = `<div class="panel"><h2>সবার সারসংক্ষেপ</h2>${cohortHtml(lb)}<p class="note" style="margin-top:14px">শুধু দলগত হিসাব দেখানো হয়েছে; কোনো ব্যক্তির তথ্য নেই।</p></div>`;
}

async function paneAdmin(pane){
  const subs = await backend.allSubmissions();
  const lb = await getLb();
  // প্রত্যেকের জমা নম্বর (১ = প্রথম জমা)
  const byUser = {};
  subs.sort((a,b)=>(a.clientTime||0)-(b.clientTime||0)).forEach(s=>{ const k = s.uid||s.email; byUser[k] = (byUser[k]||0)+1; s._n = byUser[k]; s._of = k; });
  subs.forEach(s=>{ s._total = byUser[s._of]; });
  const rows = subs.sort((a,b)=>(b.clientTime||0)-(a.clientTime||0));
  const latest = rows.filter(s=>s._n===s._total);
  const interestCount = {}; latest.forEach(s=>{ const k=s.profile?.interest||"—"; interestCount[k]=(interestCount[k]||0)+1; });
  pane.innerHTML = `<div class="panel">
    <h2>দলগত বিশ্লেষণ</h2>
    ${lb.length?cohortHtml(lb):"<p>এখনো কোনো জমা নেই।</p>"}
    <p class="note" style="margin-top:10px">আগ্রহ অনুযায়ী: ${Object.entries(interestCount).map(([k,v])=>`${esc(k)} ${bn(v)} জন`).join("; ")}</p>
  </div>
  <div class="panel" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>সব জমা (নামসহ)</h2><button class="small" id="csv">CSV ডাউনলোড</button></div>
    <p class="note">এই অংশ শুধু অ্যাডমিন দেখতে পান। মোট ${bn(rows.length)}টি জমা, ${bn(latest.length)} জন অংশগ্রহণকারী; নতুন জমা উপরে।</p>
    <div class="scroll"><table class="lb admin">
      <thead><tr><th>সময়</th><th>জমা নং</th><th>নাম</th><th>ইমেইল</th><th>ধারা</th><th>আগ্রহ</th><th>স্কোর</th><th>স্তর</th>${DOMAINS.map(d=>`<th title="${esc(d.name)}">${d.id.toUpperCase()}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(s=>`<tr><td>${fmtTime(s.clientTime)}</td><td>${bn(s._n)}/${bn(s._total)}</td><td>${esc(s.profile?.name||"নাম দেননি")}</td><td>${esc(s.email)}</td><td>${esc((s.profile?.streams||[]).join(", "))}</td><td>${esc(s.profile?.interest)}</td><td>${bn(s.result.overall)}</td><td><span class="chip l${s.result.level}">${LEVELS[s.result.level].name}</span></td>${DOMAINS.map(d=>`<td>${bn(s.result.domains[d.id].score)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <p class="note">D1-D9: ${DOMAINS.map(d=>`${d.id.toUpperCase()} ${esc(d.name)}`).join("; ")}</p>
  </div>`;
  $("#csv").onclick = () => {
    const head = ["submitted_at","entry_no","entries_total","is_latest","name","email","streams","degree","ssc","experience","interest","hours","overall","level","correct_mcq",...DOMAINS.map(d=>d.id+"_score"),...DOMAINS.map(d=>d.id+"_level"),...SELF.map(s=>s.id),...MCQ.map(q=>q.id+"_correct")];
    const lines = rows.map(s=>{ const p=s.profile||{}, r=s.result;
      return [s.clientTime?new Date(s.clientTime).toISOString():"",s._n,s._total,s._n===s._total?1:0,p.name,s.email,(p.streams||[]).join("|"),p.degree,p.ssc,p.exp,p.interest,p.hours,r.overall,LEVELS[r.level].en,r.correctTotal,
        ...DOMAINS.map(d=>r.domains[d.id].score),...DOMAINS.map(d=>LEVELS[r.domains[d.id].level].en),
        ...SELF.map(x=>s.self?.[x.id]),...MCQ.map(q=>Number(s.answers?.[q.id])===q.c?1:0)]
        .map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","); });
    const blob = new Blob(["\ufeff"+[head.join(","),...lines].join("\n")],{type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `research-tna-${CONFIG.round}.csv`; a.click();
  };
}

  try{ backend = useFirebase ? await makeFirebaseBackend() : makeDemoBackend(); }

  backend.onAuth(async u => {
    state.user = u; renderWho();
    if(!u){ renderLogin(); return; }
    app.innerHTML = `<p class="note">লোড হচ্ছে…</p>`;
    try{ state.history = await backend.getMine(u.uid); }catch(e){ state.history = []; }

    if(state.mine) renderResults(); else { state.step = 0; renderForm(); }

})();
